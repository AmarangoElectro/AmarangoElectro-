<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V4.18B Responsive QA</title><style>*{box-sizing:border-box}body{margin:0;background:#071a39;color:#fff;font:14px system-ui}.bar{position:sticky;top:0;z-index:2;padding:14px 18px;background:#06142c;border-bottom:1px solid #27415f}.bar strong{display:block}.bar small{color:#9eb0c7}.frames{padding:16px;display:flex;gap:18px;align-items:flex-start;overflow-x:auto}.case{flex:0 0 auto}.case header{display:flex;justify-content:space-between;margin-bottom:6px;color:#c6d3e5;font-size:11px}.case iframe{height:900px;border:2px solid #f17221;border-radius:12px;background:#fff}</style></head><body><div class="bar"><strong>V4.18B · Storefront Admin Mode · QA portable</strong><small>Abrir Administración → Tienda Admin. OFF debe conservar Vista Cliente; ON agrega controles contextuales. Sin writes.</small></div><main class="frames" id="frames"></main><script>const widths=[320,360,390,412,768,1440];const root=document.getElementById('frames');for(const width of widths){const section=document.createElement('section');section.className='case';section.dataset.width=String(width);section.innerHTML=`<header><span>${width}px</span><span class="measure">pendiente</span></header><iframe title="QA ${width}" width="${width}" src="/administracion"></iframe>`;const frame=section.querySelector('iframe');frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;const viewport=doc.documentElement.clientWidth;const scroll=doc.documentElement.scrollWidth;section.querySelector('.measure').textContent=`viewport ${viewport} / scroll ${scroll} · ${scroll<=viewport?'PASS':'REVISAR'}`}catch{section.querySelector('.measure').textContent='medición no disponible'}});root.append(section)}</script></body></html>
