name: Quitar navegador lateral

on:
  push:
    branches:
      - fix/quitar-navegador-lateral-20260824-v2
    paths:
      - .github/workflows/quitar-nav-lateral-20260824.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quitar-navegador-lateral-20260824-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retirar navegador lateral sin tocar las otras mejoras
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/tienda-productividad.js')
          s=p.read_text()
          s=s.replace('   - agrega navegación rápida por categorías en el lateral\n','')
          s=re.sub(r"\n  var fastNav=null;\n  var fastBubble=null;\n  var fastCats=\[\];\n  var fastPendiente='';\n  var fastDragging=false;\n  var fastPointerId=null;\n",'\n',s, count=1)
          s=re.sub(r"\n      \+'#ae-fast-nav\{.*?\+'#ae-fast-bubble\.on\{display:block\}\\n'",'',s, count=1, flags=re.S)
          s=re.sub(r"\n  function categoriasDisponibles\(\)\{.*?\n  /\* El action sheet profesional ya existe",'\n\n  /* El action sheet profesional ya existe',s, count=1, flags=re.S)
          s=s.replace('      asegurarFastNav();\n','')
          s=re.sub(r"\n    window\.addEventListener\('resize',function\(\)\{if\(!rafUi\)rafUi=requestAnimationFrame\(function\(\)\{rafUi=0;posicionarFastNav\(\);actualizarFastNavVisible\(\);\}\);\},\{passive:true\}\);\n    window\.addEventListener\('scroll',actualizarFastNavVisible,\{passive:true\}\);",'',s, count=1)
          p.write_text(s)
          PY
      - name: Validar
        run: |
          node --check public/tienda-productividad.js
          ! grep -q 'ae-fast-nav' public/tienda-productividad.js
          ! grep -q 'fastBubble' public/tienda-productividad.js
          ! grep -q 'asegurarFastNav' public/tienda-productividad.js
          grep -q 'ae-card-copy-name' public/tienda-productividad.js
          grep -q 'ae-mayorista-select' public/tienda-productividad.js
          grep -q 'prod-card:active{transform:none' public/tienda-productividad.js
          git diff --check
      - name: Guardar cambio
        run: |
          git config user.name "chatgpt-amarango"
          git config user.email "actions@users.noreply.github.com"
          git add public/tienda-productividad.js
          git commit -m "Quita navegador lateral de categorias" || exit 0
          git push origin HEAD:fix/quitar-navegador-lateral-20260824-v2
