name: Check Margarita clientes 24h temp
on:
  push:
    branches: [feat/margarita-clientes-24h-regalo-20260824]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: node --check public/margarita-clientes-24h-cta.js
      - name: Scope
        run: |
          set -e
          git diff --name-only origin/main...HEAD | grep -Fx 'public/index.html' && exit 1 || true
          grep -q "margarita-clientes-24h-cta.js?v=20260824-1" public/margarita-ui.js
          grep -q "concretás tu primera compra" public/margarita-clientes-24h-cta.js
