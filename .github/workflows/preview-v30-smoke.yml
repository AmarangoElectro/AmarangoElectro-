name: Validar preview V30

on:
  push:
    branches:
      - "work/tienda-vieja-admin-compacto-ia-20261021"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar código de rama de prueba
        uses: actions/checkout@v4
      - name: Comprobar sintaxis y preservación de funciones
        run: |
          node --check public/admin-compact-v30.js
          node --check src/ai-product-image.mjs
          node --check src/worker.mjs
          node --test tests/admin-compact-v30.test.mjs
      - name: Verificar que el despliegue sirva la tienda y sus recursos
        shell: bash
        run: |
          set -euo pipefail
          url="https://deploy-preview-22--amarangoelectro.netlify.app"
          ok=0
          for i in $(seq 1 18); do
            if curl --retry 1 --max-time 20 -fsSL "$url/" -o /tmp/preview-v30-index.html &&
               grep -qi "AmarangoElectro" /tmp/preview-v30-index.html &&
               curl --retry 1 --max-time 20 -fsSL "$url/admin-compact-v30.css" -o /tmp/preview-v30.css &&
               curl --retry 1 --max-time 20 -fsSL "$url/admin-compact-v30.js" -o /tmp/preview-v30.js &&
               grep -q "ae-v30-tools" /tmp/preview-v30.js; then
              ok=1
              break
            fi
            echo "Intento $i: preview aún no disponible; reintentando..."
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::El preview aún devuelve error o no sirve los archivos del admin."
            exit 1
          fi
          echo "PASS: /, CSS y JS de Admin V30 sirven contenido real"

  diagnostico-tienda-original:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Comprobar DNS y HTTP solo lectura del dominio original
        shell: bash
        run: |
          set +e
          echo "=== FECHA ==="
          date -u
          echo "=== DNS ==="
          getent ahosts amarangoelectro.com.ar | head -8
          getent ahosts www.amarangoelectro.com.ar | head -8
          echo "=== CURL tienda original ==="
          for url in "https://amarangoelectro.com.ar/" "https://www.amarangoelectro.com.ar/" "https://amarangoelectro.com.ar/api/catalogo-cache"; do
            echo "URL $url"
            curl --max-time 18 -sS -L -o /dev/null -D /tmp/orig-headers \
              -w 'HTTP=%{http_code} IP=%{remote_ip} TLS=%{ssl_verify_result} redirect=%{redirect_url} total=%{time_total}\n' "$url"
            head -15 /tmp/orig-headers 2>/dev/null | grep -Ei '^(HTTP|server:|cf-ray:|location:|content-type:|x-)'
          done
          echo "=== RESPUESTA JSON ERROR CACHE (sólo si HTTP != 200) ==="
          code=$(curl --max-time 18 -sS -o /tmp/cache-error -w '%{http_code}' "https://amarangoelectro.com.ar/api/catalogo-cache")
          echo "cache_status=$code"
          if [ "$code" != "200" ]; then head -c 280 /tmp/cache-error; echo; fi
          echo "=== API REST SUPABASE: ESTADO LECTURA ANON (SIN EXHIBIR CLAVE) ==="
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const url=new URL(p.vars.SUPABASE_URL+'/rest/v1/tienda_catalogo');
          url.search='?id=eq.catalogo&select=id&limit=1';
          const headers={apikey:p.vars.SUPABASE_ANON_KEY,Authorization:'Bearer '+p.vars.SUPABASE_ANON_KEY};
          fetch(url,{headers,signal:AbortSignal.timeout(12000)})
          .then(async r=>{
             console.log('supabase_rest_status='+r.status);
             if(!r.ok)console.log('supabase_rest_error='+String(await r.text()).slice(0,240));
             else console.log('supabase_rest_ok=true');
          }).catch(e=>console.log('supabase_rest_fetch_error='+e.name+':'+e.message));
          NODE
          echo "=== FIN (no se modificó producción) ==="
