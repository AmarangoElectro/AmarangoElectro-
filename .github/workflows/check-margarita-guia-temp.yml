name: Check Margarita Guia temp
on:
  push:
    branches:
      - feat/margarita-guia-v21-20260824
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check public/margarita-guia-clientes.js
      - name: Scope check
        shell: bash
        run: |
          set -euo pipefail
          test -f public/margarita-guia-clientes.js
          grep -q "Solo afecta rol CLIENTE" public/margarita-guia-clientes.js
          grep -q "margarita_registrar_cliente_guia" public/margarita-guia-clientes.js
          git diff --name-only origin/main...HEAD | grep -Fx "public/index.html" && exit 1 || true
