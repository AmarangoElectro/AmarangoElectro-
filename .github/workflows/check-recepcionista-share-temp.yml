name: Check recepcionista share temp
on:
  push:
    branches: [feat/margarita-recepcionista-share-20260824]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check public/margarita-guia-clientes.js
          node --check public/tienda-compartir-producto.js
      - name: Scope
        run: |
          set -e
          git diff --name-only origin/main...HEAD | grep -Fx 'public/index.html' && exit 1 || true
          grep -q 'Margarita Recepcionista' public/margarita-guia-clientes.js
          grep -q 'Compartir producto' public/tienda-compartir-producto.js
          grep -q 'tienda-compartir-producto' public/margarita-ui.js
