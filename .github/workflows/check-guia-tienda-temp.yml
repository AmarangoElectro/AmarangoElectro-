name: Check guia tienda temp
on:
  push:
    branches: [feat/guia-tienda-v21-20260824]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check public/margarita-guia-clientes.js
          node --check public/tienda-inicio-productos.js
      - name: Scope
        run: |
          set -e
          git diff --name-only origin/main...HEAD | grep -Fx 'public/index.html' && exit 1 || true
          grep -q 'No busca ni recomienda productos puntuales' public/margarita-guia-clientes.js
          grep -q 'Ver todos' public/tienda-inicio-productos.js
