name: Patch marketing UI 20260824

on:
  push:
    branches:
      - feat/compartir-margarita-scroll-contactos-20260824
    paths:
      - .github/workflows/patch-marketing-ui-20260824.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compartir-margarita-scroll-contactos-20260824
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar cambios seguros
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          idx = Path('public/index.html')
          s = idx.read_text(encoding='utf-8')

          # 1) Contactos vigentes: solo Maximiliano y Ángela.
          pat = re.compile(r"var TIENDA_VENDEDORES=\[\s*\{nombre:'Maximiliano',\s*tel:'5491168610532'\},\s*\{nombre:'Angela',\s*tel:'5491168746034'\},\s*\{nombre:'Selene',\s*tel:'5491162107212'\}\s*\];")
          repl = "var TIENDA_VENDEDORES=[\n  {nombre:'Maximiliano', tel:'5491168610532'},\n  {nombre:'Ángela',      tel:'5491168746034'}\n];"
          s, n = pat.subn(repl, s, count=1)
          if n != 1:
              raise SystemExit('No se encontró el bloque TIENDA_VENDEDORES esperado')

          s = s.replace('Maxi, Angela o Selene', 'Maximiliano o Ángela')
          s = s.replace('¿Ya tenés vendedor?', '¿Ya tenés asesor?')
          s = s.replace('Consultá con tu vendedor', 'Consultá con tu asesor')
          s = s.replace('pagos los coordinás con tu vendedor', 'pagos los coordinás con tu asesor')

          # 2) Compartir producto visible también para cliente/vista previa cliente.
          marker = '      // los revendedores también pueden COMPARTIR con foto y formato de precio (igual que admin), salvo en vista previa de cliente\n'
          if marker not in s:
              raise SystemExit('No se encontró el punto de inserción del compartir cliente')
          bloque = '''      // Marketing orgánico: el cliente puede compartir un producto sin ver controles internos.\n      if((!revUnlocked&&!adminUnlocked)||vistaPreviaCliente){\n        card+='<button class="ae-share-product-client" style="width:100%;font-size:.72rem;padding:9px 8px;margin-top:7px;background:#fff;color:var(--az);border:1.5px solid #cbdaf0;border-radius:9px;font-weight:850;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 2px 7px rgba(11,45,107,.08);" onclick="event.stopPropagation();compartirProducto('+pid+')"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><circle cx="18" cy="5" r="2.3"></circle><circle cx="6" cy="12" r="2.3"></circle><circle cx="18" cy="19" r="2.3"></circle><path d="m8.1 10.8 7.6-4.4M8.1 13.2l7.6 4.4"></path></svg><span>Compartir</span></button>';\n      }\n'''
          s = s.replace(marker, bloque + marker, 1)

          # 3) Margarita: botón discreto de nueva charla al lado de los controles del header.
          close_marker = '      <button onclick="margaritaCerrar()" aria-label="Cerrar" style="background:none;border:none;color:#fff;font-size:1.6rem;cursor:pointer;padding:4px;">×</button>\n'
          if close_marker not in s:
              raise SystemExit('No se encontró el botón cerrar de Margarita')
          reset_btn = '      <button id="margarita-reset-btn" onclick="margaritaNuevaCharla()" aria-label="Nueva charla" title="Nueva charla" style="width:38px;height:38px;border-radius:11px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto;">↻</button>\n'
          s = s.replace(close_marker, reset_btn + close_marker, 1)

          fn_marker = "function margaritaCerrar(){document.getElementById('margarita-overlay').style.display='none';}\n"
          if fn_marker not in s:
              raise SystemExit('No se encontró margaritaCerrar')
          reset_fn = '''function margaritaNuevaCharla(){\n  _margaritaHist=[];\n  _margaritaCargando=false;\n  try{margaritaEscribiendo(false);}catch(e){}\n  var cont=document.getElementById('margarita-msgs');\n  var inp=document.getElementById('margarita-input');\n  if(cont)cont.innerHTML='';\n  if(inp)inp.value='';\n  margaritaPintar('margarita','¡Hola! Soy Margarita 🐝 ¿Qué estás buscando? Te hago unas preguntas cortitas y te ayudo a elegir la mejor opción.');\n  if(inp)setTimeout(function(){inp.focus();},40);\n}\n'''
          s = s.replace(fn_marker, reset_fn + fn_marker, 1)

          # 4) Evitar trabajo de DOM innecesario en cada pixel de scroll.
          old_close = "function hdrCerrarSugerencias(){\n  var box=document.getElementById('hdr-sugerencias');\n  if(box){ box.style.display='none'; box.innerHTML=''; }\n}"
          new_close = "function hdrCerrarSugerencias(){\n  var box=document.getElementById('hdr-sugerencias');\n  if(box && (box.style.display!=='none' || box.childNodes.length)){ box.style.display='none'; box.innerHTML=''; }\n}"
          if old_close not in s:
              raise SystemExit('No se encontró hdrCerrarSugerencias esperado')
          s = s.replace(old_close, new_close, 1)

          old_listener = "  window.addEventListener('scroll', chequear, true);\n})();"
          new_listener = "  var _arribaScrollRaf=0;\n  function chequearSuave(){\n    if(_arribaScrollRaf)return;\n    _arribaScrollRaf=window.requestAnimationFrame(function(){_arribaScrollRaf=0;chequear();});\n  }\n  window.addEventListener('scroll', chequearSuave, {passive:true});\n  chequear();\n})();"
          if old_listener not in s:
              raise SystemExit('No se encontró listener del botón volver arriba')
          s = s.replace(old_listener, new_listener, 1)

          # Todas las variantes antiguas de compartir tienda deben compartir la URL limpia.
          s = s.replace("var link=window.location.href.split('#')[0];", "var link=window.location.href.split('#')[0].split('?')[0];")

          idx.write_text(s, encoding='utf-8')

          # 5) Reusar el botón profesional de compartir tienda también en admin
          # (cliente y asesor ya lo recibían). Debounce del observer para reducir repaints.
          opt = Path('public/tienda-optimizaciones.js')
          t = opt.read_text(encoding='utf-8')
          t = t.replace('const VERSION = "egress-2026-08-23-3";', 'const VERSION = "marketing-scroll-2026-08-24-1";', 1)
          admin_block = '''  let boton = document.getElementById("ae-share-store-btn");\n  const admin = esAdminActual();\n  const marca = header.querySelector(".hdr-marca");\n\n  if (admin) {\n    if (boton) boton.remove();\n    if (marca && marca.dataset.aeSharePadding === "1") {\n      marca.style.removeProperty("padding-right");\n      delete marca.dataset.aeSharePadding;\n    }\n    return true;\n  }\n'''
          admin_repl = '''  let boton = document.getElementById("ae-share-store-btn");\n  const marca = header.querySelector(".hdr-marca");\n'''
          if admin_block not in t:
              raise SystemExit('No se encontró bloqueo admin del compartir tienda')
          t = t.replace(admin_block, admin_repl, 1)

          old_obs = '''    const obs = new MutationObserver(function() {\n      protegerControlesInternosFueraDeAdmin();\n      instalarBotonCompartirTienda();\n    });\n'''
          new_obs = '''    let uiRaf = 0;\n    const obs = new MutationObserver(function() {\n      if (uiRaf) return;\n      uiRaf = window.requestAnimationFrame(function() {\n        uiRaf = 0;\n        protegerControlesInternosFueraDeAdmin();\n        instalarBotonCompartirTienda();\n      });\n    });\n'''
          if old_obs not in t:
              raise SystemExit('No se encontró MutationObserver esperado')
          t = t.replace(old_obs, new_obs, 1)
          opt.write_text(t, encoding='utf-8')
          PY

      - name: Validaciones estáticas
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          s=Path('public/index.html').read_text(encoding='utf-8')
          t=Path('public/tienda-optimizaciones.js').read_text(encoding='utf-8')
          checks={
            'Selene fuera del selector': "nombre:'Selene'" not in s,
            'solo Ángela vigente': "nombre:'Ángela'" in s,
            'texto asesor': 'Consultá con tu asesor' in s,
            'share cliente': 'ae-share-product-client' in s,
            'reset Margarita': 'margaritaNuevaCharla' in s and 'margarita-reset-btn' in s,
            'share tienda URL limpia': "split('#')[0].split('?')[0]" in s,
            'observer amortiguado': 'let uiRaf = 0;' in t,
            'share tienda también admin': 'if (admin) {' not in t[t.find('function instalarBotonCompartirTienda'):t.find('function protegerControlesInternosFueraDeAdmin')],
            'scroll rAF': 'function chequearSuave()' in s,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('Fallaron checks: '+', '.join(bad))

          # Comprobar sintaxis de cada script clásico inline por separado.
          scripts=re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)
          for i,(attrs,body) in enumerate(scripts):
            if re.search(r'type\s*=\s*["\']module["\']',attrs,re.I) or re.search(r'\bsrc\s*=',attrs,re.I):
              continue
            p=Path('/tmp')/f'inline_{i}.js'
            p.write_text(body,encoding='utf-8')
            r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
            if r.returncode:
              print(r.stdout); print(r.stderr); raise SystemExit(f'Sintaxis JS inválida en script {i}')
          PY
          node --check public/tienda-optimizaciones.js

      - name: Commit de la rama
        shell: bash
        run: |
          git config user.name "chatgpt-amarango"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html public/tienda-optimizaciones.js
          git commit -m "Mejora compartir, Margarita, contactos y scroll"
          git push origin HEAD:feat/compartir-margarita-scroll-contactos-20260824
