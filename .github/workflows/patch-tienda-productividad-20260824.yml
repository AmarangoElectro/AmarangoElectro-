name: Validar productividad tienda

on:
  push:
    branches:
      - feat/scroll-rapido-mayoristas-copiar-20260824
    paths:
      - .github/workflows/patch-tienda-productividad-20260824.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scroll-rapido-mayoristas-copiar-20260824
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enlazar módulo independiente de tienda
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/worker-professional.mjs')
          s=p.read_text()
          marker='<script src="/professional-dialogs.js?v=20260823-1" defer></script>\n'
          add=marker+'<script src="/tienda-productividad.js?v=20260824-1" defer></script>\n'
          if '/tienda-productividad.js?v=20260824-1' not in s:
              if marker not in s:
                  raise SystemExit('No se encontró punto de inserción')
              s=s.replace(marker,add,1)
              p.write_text(s)
          PY
      - name: Validar sintaxis y alcance
        run: |
          node --check public/tienda-productividad.js
          node --check src/worker-professional.mjs
          grep -q 'tienda-productividad.js?v=20260824-1' src/worker-professional.mjs
          grep -q 'ae-card-copy-name' public/tienda-productividad.js
          grep -q 'ae-mayorista-select' public/tienda-productividad.js
          grep -q 'ae-fast-nav' public/tienda-productividad.js
          grep -q "window.removeEventListener('scroll',viejo,false)" public/tienda-productividad.js
          grep -q 'prod-card:active{transform:none' public/tienda-productividad.js
          grep -q 'button\[onclick\*="abrirFotoGrande"\].*backdrop-filter:none' public/tienda-productividad.js
      - name: Guardar parche validado
        run: |
          git config user.name "chatgpt-amarango"
          git config user.email "actions@users.noreply.github.com"
          git add src/worker-professional.mjs
          git diff --cached --check
          git commit -m "Enlaza herramientas de productividad de tienda" || exit 0
          git push origin HEAD:feat/scroll-rapido-mayoristas-copiar-20260824
